name: Build AURORA Compressor

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest,   name: macOS }
          - { os: ubuntu-latest,  name: Linux }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure (Windows / Linux)
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DAURORA_COPY_AFTER_BUILD=OFF

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DAURORA_COPY_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      # zip сохраняет права на исполнение (upload-artifact их теряет)
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/AuroraCompressor_artefacts/Release/VST3, build/AuroraCompressor_artefacts/Release/Standalone -DestinationPath AURORA-Compressor-${{ matrix.name }}.zip

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd build/AuroraCompressor_artefacts/Release
          zip -r -y "$GITHUB_WORKSPACE/AURORA-Compressor-${{ matrix.name }}.zip" VST3 Standalone

      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-Compressor-${{ matrix.name }}
          path: AURORA-Compressor-${{ matrix.name }}.zip
